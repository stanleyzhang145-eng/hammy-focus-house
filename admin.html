<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#33273e">
<title>Hammy Top Secret Admin</title>
<link rel="stylesheet" href="admin.css?v=22">
</head>
<body>
<main class="admin-shell">
 <header>
  <div>
   <h1>Hammy Top Secret Admin</h1>
   <p>Private moderation tools. Admin sessions expire automatically.</p>
  </div>
  <span class="build">Build v22</span>
 </header>

 <section id="adminLoginPanel" class="panel admin-login-panel">
  <div class="admin-lock">🔐</div>
  <label>Top secret admin code
   <input id="adminCode" type="password" autocomplete="off" maxlength="160"
    placeholder="Enter private admin code">
  </label>
  <button id="adminLogin">Unlock panel</button>
  <a class="back-link" href="./">Return to Hammy</a>
 </section>

 <section id="adminToolsPanel" class="panel hidden">
  <label>Report status
   <select id="reportStatus">
    <option value="open">Open</option>
    <option value="reviewed">Reviewed</option>
    <option value="dismissed">Dismissed</option>
    <option value="all">All</option>
   </select>
  </label>
  <button id="loadReports">Refresh reports</button>
  <button id="adminLogout" class="secondary">Lock admin panel</button>
  <a class="back-link" href="./">Return to Hammy</a>
 </section>

 <div id="adminMessage" class="message">Enter the private top secret code.</div>
 <section id="reportList" class="report-list"></section>
</main>
<script src="admin.js?v=22"></script>
</body>
</html>
