<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8b63d9">
<title>Hammy Moderation</title>
<link rel="stylesheet" href="admin.css?v=21">
</head>
<body>
<main class="admin-shell">
 <header>
  <div>
   <h1>Hammy Gallery Moderation</h1>
   <p>Review preset reports. No chat or custom report text is collected.</p>
  </div>
  <span class="build">Build v21</span>
 </header>

 <section class="panel">
  <label>Admin key
   <input id="adminKey" type="password" autocomplete="off" placeholder="Paste the Render ADMIN_KEY">
  </label>
  <label>Report status
   <select id="reportStatus">
    <option value="open">Open</option>
    <option value="reviewed">Reviewed</option>
    <option value="dismissed">Dismissed</option>
    <option value="all">All</option>
   </select>
  </label>
  <button id="loadReports">Load reports</button>
  <button id="forgetAdminKey" class="secondary">Forget key</button>
 </section>

 <div id="adminMessage" class="message">Enter the private ADMIN_KEY from Render.</div>
 <section id="reportList" class="report-list"></section>
</main>
<script src="admin.js?v=21"></script>
</body>
</html>
