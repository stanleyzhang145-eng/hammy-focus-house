services:
  - type: web
    name: hammy-focus-cloud
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health/ready
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hammy-focus-cloud-db
          property: connectionString
      - key: ADMIN_KEY
        generateValue: true
      - key: ADMIN_ACCESS_CODE
        generateValue: true
      - key: ALLOW_PREMIUM_PREVIEW
        value: "true"
      - key: NODE_VERSION
        value: "20"

databases:
  - name: hammy-focus-cloud-db
    plan: free
    region: ohio
    databaseName: hammy_focus
    user: hammy_focus_user
    ipAllowList: []
